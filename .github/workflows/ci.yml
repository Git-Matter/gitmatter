name: CI

# Verify gate: format, lint, types, and tests. Runs on PRs into dev/main and is
# reused (workflow_call) by the staging and release pipelines so a deploy never
# ships unverified code.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    # Core tests hit the database (Drizzle) and S3 object storage, so spin up
    # pgvector and MinIO before running. MinIO stands in for R2/S3 — the storage
    # suites exercise real upload/download/presign paths, and they self-skip when
    # S3_ACCESS_KEY is unset.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: gitmatter
          POSTGRES_PASSWORD: gitmatter
          POSTGRES_DB: gitmatter
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U gitmatter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://gitmatter:gitmatter@localhost:5432/gitmatter
      # MinIO endpoint for the object-storage suites (started in its own step).
      # Every service in core/storage.ts only varies by env var, so legacy/R2
      # config is enough here. Path-style + a dummy region is what MinIO wants.
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: gitmatter
      S3_FORCE_PATH_STYLE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # build → lint → test: fail fast on a broken build before linting, and lint
      # before the (slower, DB-backed) tests.
      - name: Build
        run: bun run build

      - name: Lint (format, lint, types)
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Check generated MCP reference
        run: bun run docs:tools:check

      - name: Check synthetic NDA source
        run: bun run fixtures:nda:check

      # Legacy community container images are no longer publicly available.
      # Pin official release binaries and their published SHA-256 checksums;
      # this preserves real S3 integration tests without registry credentials.
      - name: Start MinIO
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/minio" \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/mc" \
            https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          echo "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f  $RUNNER_TEMP/minio" | sha256sum --check
          echo "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891  $RUNNER_TEMP/mc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/minio" "$RUNNER_TEMP/mc"
          MINIO_ROOT_USER="$S3_ACCESS_KEY" MINIO_ROOT_PASSWORD="$S3_SECRET_KEY" \
            nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            >"$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then break; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
            cat "$RUNNER_TEMP/minio.log"
            exit 1
          fi
          "$RUNNER_TEMP/mc" alias set local http://127.0.0.1:9000 "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          "$RUNNER_TEMP/mc" mb --ignore-existing "local/$S3_BUCKET"

      - name: Migrate test database
        run: cd packages/db && bun run migrate

      - name: Test
        run: bun run test:ci
